server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5433/payments
    username: app
    password: ${POSTGRES_PASSWORD:localdev}
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 3000
        request.timeout.ms: 2000
        delivery.timeout.ms: 4000

payment:
  simulation:
    # SIMULATED: share of payments that are declined (0.0 to 1.0). Change at runtime with PUT /simulation/failure-rate
    failure-rate: 0.2

---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.percentiles-histogram.spring.kafka.listener: true
spring:
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
