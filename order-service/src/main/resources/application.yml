server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/orders
    username: app
    password: ${POSTGRES_PASSWORD:localdev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 3000
        request.timeout.ms: 2000
        delivery.timeout.ms: 4000

orders:
  # OUTBOX = correct. DUAL_WRITE = deliberately unsafe, kept only to demonstrate the failure.
  publish-mode: OUTBOX

---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.percentiles-histogram.spring.kafka.listener: true
spring:
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

---
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
logging:
  pattern:
    correlation: "[%X{traceId:-},%X{correlationId:-}] "
  file:
    name: ../logs/order-service.log

---
management.observations.enable.tasks.scheduled.execution: false
